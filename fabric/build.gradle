plugins {
    id 'multiloader-loader'
    id 'com.hypherionmc.modutils.modpublisher'
}

repositories {
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/'
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

publisher {
    apiKeys {
        curseforge System.getenv('CURSEFORGE_TOKEN')
        modrinth System.getenv('MODRINTH_TOKEN')
    }

    setDisplayName("[Fabric ${project.minecraft_version}] Idle Boost ${project.version}")
    setVersion(project.version)
    setVersionType('release')
    setGameVersions(project.minecraft_version)
    setLoaders(project.name)
    setChangelog(rootProject.file('changelog.md').text)

    setArtifact(tasks.jar)

    curseDepends {
        required 'fabric-api'
        optional 'modmenu'
    }

    modrinthDepends {
        required 'fabric-api'
        optional 'modmenu'
    }

    setCurseID('1054545')
    setModrinthID('REC6ythZ')
}